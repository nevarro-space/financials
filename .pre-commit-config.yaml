repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: hledger-fmt
        name: hledger-fmt
        entry: hledger-fmt -w --root ledger/all.journal
        language: golang
        additional_dependencies:
          - github.com/juev/hledger-lsp/cmd/hledger-fmt@v0.3.1
        files: \.(hledger|journal|j)$

      - id: hledger-check
        name: hledger check
        entry: hledger -f ledger/all.journal check -s ordereddates
        language: system
        files: ^ledger/
        pass_filenames: false
